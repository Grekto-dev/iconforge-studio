<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Base Squircle Gradient -->
    <linearGradient id="bgGrad" x1="16" y1="12" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <linearGradient id="rimGrad" x1="12" y1="12" x2="116" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Top-Left Tile: Fluent Folder Gold/Amber -->
    <linearGradient id="tileAmber" x1="24" y1="24" x2="68" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Top-Right Tile: Fluent Emerald/Teal -->
    <linearGradient id="tileTeal" x1="60" y1="26" x2="104" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>

    <!-- Front Hero Tile: Fluent Cyan -> Indigo -->
    <linearGradient id="tileHero" x1="34" y1="44" x2="94" y2="106" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="55%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <!-- Inner Glass Highlight -->
    <linearGradient id="glassShine" x1="40" y1="46" x2="88" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>

    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Main App Squircle Background -->
  <rect x="10" y="10" width="108" height="108" rx="26" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="2.5"/>

  <!-- Subtle Grid Lines in Background -->
  <path d="M36 12v104M64 12v104M92 12v104M12 36h104M12 64h104M12 92h104" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1.5"/>

  <!-- Back Left Floating Icon Card (Amber Folder style) -->
  <g transform="rotate(-10 46 48)" filter="url(#dropShadow)">
    <rect x="24" y="26" width="44" height="44" rx="12" fill="url(#tileAmber)"/>
    <path d="M32 37h10l4 4h14v17a3 3 0 0 1-3 3H32a3 3 0 0 1-3-3V40a3 3 0 0 1 3-3z" fill="#fff" fill-opacity="0.9"/>
  </g>

  <!-- Back Right Floating Icon Card (Teal App style) -->
  <g transform="rotate(10 82 48)" filter="url(#dropShadow)">
    <rect x="60" y="26" width="44" height="44" rx="12" fill="url(#tileTeal)"/>
    <circle cx="82" cy="48" r="11" fill="#fff" fill-opacity="0.9"/>
    <circle cx="82" cy="48" r="5" fill="#0d9488"/>
  </g>

  <!-- Foreground Hero Forge Card (Fluent Blue/Indigo) -->
  <g filter="url(#dropShadow)">
    <rect x="35" y="45" width="58" height="58" rx="16" fill="url(#tileHero)" stroke="url(#glassShine)" stroke-width="2"/>
    
    <!-- Isometric Layered Stack + Spark inside Hero Card -->
    <path d="M64 55L46 64l18 9 18-9-18-9z" fill="#ffffff" fill-opacity="0.95"/>
    <path d="M46 73l18 9 18-9" fill="none" stroke="#bae6fd" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M46 82l18 9 18-9" fill="none" stroke="#7dd3fc" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Glowing Spark Badge (Top Right of Hero Card) -->
  <g filter="url(#dropShadow)">
    <circle cx="91" cy="47" r="11" fill="#10b981" stroke="#0f172a" stroke-width="2.5"/>
    <path d="M91 40l2.2 4.8L98 47l-4.8 2.2L91 54l-2.2-4.8L84 47l4.8-2.2L91 40z" fill="#ffffff"/>
  </g>
</svg>
